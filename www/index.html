<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Mind Real Estate - Cognitive Sync Engine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden;
    font-family:ui-monospace,Menlo,Monaco,monospace;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:absolute;inset:0}

  /* HUD INFRASTRUCTURE */
  .hud{position:fixed;left:0;right:0;padding:14px 16px;display:flex;
    justify-content:space-between;font-size:9px;letter-spacing:.28em;
    color:rgba(255,255,255,.55);text-transform:uppercase;pointer-events:none;z-index:10}
  #hudTop{top:0}
  #hudBot{bottom:0;flex-direction:column;gap:5px}
  #bar{width:100%;height:4px;background:rgba(255,255,255,.1);overflow:hidden;border-radius:2px}
  #fill{height:100%;width:0%;background:linear-gradient(90deg,#4FC3F7,#B3E5FC);
    transition:width .3s ease;box-shadow:0 0 12px #4FC3F7}
  #row{display:flex;justify-content:space-between}
  
  /* COMBO NOTIFICATION POPUP */
  #streakContainer{position:fixed;top:15%;left:50%;transform:translateX(-50%);
    font-size:14px;font-weight:bold;letter-spacing:.4em;color:#4FC3F7;
    text-shadow:0 0 10px rgba(79,195,247,0.8);pointer-events:none;z-index:15;
    opacity:0;transition:all 0.2s ease}
  #streakContainer.pop{opacity:1;transform:translateX(-50%) scale(1.2)}

  /* EMERGENCY PANIC OPTION */
  #panicBtn{position:fixed;bottom:40px;right:16px;background:rgba(255,82,82,0.15);
    border:1px solid #FF5252;color:#FF5252;padding:8px 12px;font-family:inherit;
    font-size:9px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;
    z-index:20;box-shadow:0 0 8px rgba(255,82,82,0.2);display:none;transition:all 0.2s}
  #panicBtn:active{background:#FF5252;color:#000}

  #escBtn{position:fixed;top:14px;left:16px;color:rgba(255,255,255,0.4);
    cursor:pointer;pointer-events:auto;z-index:25;font-size:9px;letter-spacing:.2em}
  #escBtn:hover{color:#fff}

  /* SCREEN ARCHITECTURE OVERLAYS */
  .screen-overlay{position:fixed;inset:0;background:#000;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:14px;transition:opacity .4s ease;overflow-y:auto}
  .screen-overlay.gone{opacity:0;pointer-events:none}
  
  h1{font-size:15px;letter-spacing:.5em;font-weight:400;text-align:center;
    margin-bottom:2px;text-shadow:0 0 8px rgba(255,255,255,0.2)}
  .subtitle{font-size:8px;letter-spacing:.35em;color:rgba(255,255,255,.45);
    text-transform:uppercase;margin-bottom:12px;text-align:center}

  /* HIGH-FIDELITY INTERACTIVE GALLERY WALL DISPLAY */
  .gallery-wall {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 780px;
    padding: 10px;
    margin-bottom: 12px;
  }
  @media(max-width: 600px){ .gallery-wall { grid-template-columns: repeat(2, 1fr); } }

  .gallery-frame {
    background: rgba(10,10,10,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    aspect-ratio: 4 / 3;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .gallery-frame:hover:not(.locked-frame) {
    border-color: #4FC3F7;
    box-shadow: 0 0 15px rgba(79,195,247,0.25);
    transform: translateY(-2px);
  }
  .gallery-frame.locked-frame {
    border-color: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.2);
    cursor: not-allowed;
  }
  .frame-title { font-size: 8px; letter-spacing: .2em; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
  .frame-desc { font-size: 7px; color: rgba(255,255,255,0.35); line-height: 1.3; }
  .frame-status { font-size: 7px; letter-spacing: .15em; color: #4FC3F7; text-transform: uppercase; margin-top: auto; padding-top: 8px; }
  .locked-frame .frame-status { color: rgba(255,255,255,0.15); }
  
  /* 3-LETTER LAYOUT FRAME SYNAPSE CHAIN CODE STACK */
  #sequenceWrapper { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .slot { padding: 2px 6px; border: 1px dashed rgba(255,255,255,0.2); font-size: 9px; transition: all 0.2s; }

  #over{z-index:40;display:none}
  #over.show{display:flex}
  #saying{font-size:13px;letter-spacing:.35em;font-weight:500;text-transform:uppercase;text-align:center}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
"use strict";
const{Engine,Bodies,Body,Composite,Events}=Matter;
const cv=document.getElementById('g');
const cx=cv.getContext('2d');
let W=0,H=0,DPR=1;

// ---------- Advanced Sequential Levels Setup Database ----------
const LEVELS=[
  {id:'self',name:'01 // THE FEEDBACK LOOP',desc:'Smash endless loop scrolling patterns and foundational mindset friction.',words:['doomscrolling','negative self-talk','sedentary lifestyle','procrastinating','complaining','oversleeping']},
  {id:'parenting',name:'02 // THE MIRROR ROOM',desc:'High Stakes. Clean up environmental triggers before they echo down.',words:['avoiding cleaning','winging it','passive screen time','neglecting partnership','procrastinating','complaining']},
  {id:'software',name:'03 // THE CODE MATRIX',desc:'Purge tutorial locks, passive code sign-offs, and technical debt structural bloat.',words:['skipping testing','siloing knowledge','passive approvals','tutorial hell','procrastinating','complaining']},
  {id:'quantum',name:'04 // THE QUANTUM LEAP',desc:'Adaptive Synapse Matrix mode. Match changing 3-letter sequence codes to dump the load floor.',words:['smoking','repeating routines','believing loops','passive ingestion','procrastinating','complaining']},
  {id:'senior',name:'05 // THE MORTAL SCORE',desc:'Relentless Constriction Countdown. Slay blocks faster than automatic decay triggers swell mass.',words:['isolation','passive tv watching','skipping movement','forgetting water','oversleeping','procrastinating']}
];
const POS=['drinking water','taking deep breath','cleaning space'];

let unlockedLevelIndex = parseInt(localStorage.getItem('mre_unlocked_idx')) || 0;
let currentLevel = LEVELS[0];

const L={};
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
  L.HC=H*0.26;L.HW=Math.min(W*0.82,340);L.HH=Math.min(H*0.30,210);L.HEXIT=L.HC+L.HH*0.42;
  L.BY=H*1.02;L.BR=Math.min(W*0.24,100);L.BT=H*1.38;L.BB=H*1.92;L.BCX=W/2;L.BHW=Math.min(W*0.44,210);L.WH=H*2.05;
  rebuildWalls();
}

const cam={y:0,vy:0};
function maxScroll(){return Math.max(0,L.WH-H);}
function clampCam(){if(cam.y<0)cam.y=0;const m=maxScroll();if(cam.y>m)cam.y=m;}

const eng=Engine.create();
eng.world.gravity.y=1.0;
let walls=[];
function rebuildWalls(){
  if(walls.length){walls.forEach(w=>Composite.remove(eng.world,w));}
  walls=[];
  const c=L.BCX,hw=L.BHW,t=50,top=L.BT,bot=L.BB;
  walls.push(Bodies.rectangle(c,bot+t/2,hw*2+t*2,t,{isStatic:true,label:'floor'}));
  walls.push(Bodies.rectangle(c-hw-t/2,(top+bot)/2,t,bot-top+t,{isStatic:true,label:'wall'}));
  walls.push(Bodies.rectangle(c+hw+t/2,(top+bot)/2,t,bot-top+t,{isStatic:true,label:'wall'}));
  Composite.add(eng.world,walls);
}

const COL={line:'#fff',dim:'rgba(255,255,255,.4)',faint:'rgba(255,255,255,.1)',red:'#FF5252',water:'#4FC3F7',breath:'#B3E5FC',panicRed:'rgba(255,82,82,0.8)'};
function bo(e){return Object.assign({restitution:.15,friction:.58,frictionAir:.015,density:.0014},e||{});}
function T(b,fn){cx.save();cx.translate(b.position.x,b.position.y);cx.rotate(b.angle);fn();cx.restore();}

// ---------- Canvas Rendering Core Functions ----------
function dWater(b){T(b,()=>{cx.fillStyle='rgba(79,195,247,.75)';cx.strokeStyle=COL.water;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,-12);cx.bezierCurveTo(9,-3,8,9,0,9);cx.bezierCurveTo(-9,9,-9,-3,0,-12);cx.closePath();cx.fill();cx.stroke();});}
function dRipple(b){T(b,()=>{cx.strokeStyle=COL.breath;cx.lineWidth=1.4;cx.beginPath();cx.ellipse(0,0,20,9,0,0,Math.PI*2);cx.stroke();});}
function dSpark(b){T(b,()=>{cx.fillStyle='#fff';cx.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/2,rr=i%2===0?12:4;i?cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):cx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.closePath();cx.fill();});}

function neonNeg(b,fn){T(b,()=>{cx.strokeStyle=COL.red;cx.fillStyle='rgba(255,82,82,.12)';cx.lineWidth=1.6;if(state.procrastinationActive)cx.scale(2,2);fn();});}
function dClock(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-14,-20,28,40);cx.fill();cx.stroke();});}
function dLips(b){neonNeg(b,()=>{cx.beginPath();cx.moveTo(-18,0);cx.bezierCurveTo(-10,-6,10,-6,18,0);cx.bezierCurveTo(10,6,-10,6,-18,0);cx.closePath();cx.fill();cx.stroke();});}
function dBed(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-26,-5,52,10);cx.fill();cx.stroke();});}
function dEmoji(b){neonNeg(b,()=>{cx.beginPath();cx.arc(0,0,14,0,Math.PI*2);cx.fill();cx.stroke();});}
function dRedBar(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-30,-5,60,10);cx.fill();cx.stroke();});}
function dCouch(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-24,0,48,12);cx.fill();cx.stroke();});}
function dStick(b){neonNeg(b,()=>{cx.beginPath();cx.arc(0,-8,4,0,Math.PI*2);cx.fill();cx.stroke();cx.beginPath();cx.moveTo(0,-4);cx.lineTo(0,10);cx.stroke();});}
function dTV(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-18,-10,36,20);cx.fill();cx.stroke();});}
function dChair(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-10,-2,20,4);cx.fill();cx.stroke();});}
function dBottle(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-4,-12,8,24);cx.fill();cx.stroke();});}
function dPencil(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-3,-14,6,28);cx.fill();cx.stroke();});}
function dGate(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-24,-16,48,32);cx.fill();cx.stroke();});}
function dBinary(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-18,-8,36,16);cx.fill();cx.stroke();});}
function dManual(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-16,-20,32,40);cx.fill();cx.stroke();});}
function dSpray(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-7,-5,14,18);cx.fill();cx.stroke();});}
function dWings(b){neonNeg(b,()=>{cx.beginPath();cx.moveTo(0,0);cx.lineTo(-22,-6);cx.lineTo(0,4);cx.closePath();cx.fill();cx.stroke();});}
function dCtrl(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-18,-5,36,10);cx.fill();cx.stroke();});}
function dHeart(b){neonNeg(b,()=>{cx.beginPath();cx.arc(-6,-3,6,0,Math.PI,true);cx.arc(6,-3,6,0,Math.PI,true);cx.lineTo(0,12);cx.closePath();cx.fill();cx.stroke();});}
function dCig(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-12,-3,24,6);cx.fill();cx.stroke();});}
function dLoop(b){neonNeg(b,()=>{cx.beginPath();cx.arc(0,0,16,0,Math.PI*2);cx.stroke();});}
function dQ(b){neonNeg(b,()=>{cx.beginPath();cx.arc(0,0,12,0,Math.PI*2);cx.stroke();});}
function dBag(b){neonNeg(b,()=>{cx.beginPath();cx.rect(-12,-7,24,18);cx.fill();cx.stroke();});}

const S={
  'drinking water':{kind:'pos',label:'pos:water',body:(x,y)=>Bodies.circle(x,y,10,bo({density:.001,restitution:.4,label:'pos:water'})),draw:dWater},
  'taking deep breath':{kind:'pos',label:'pos:breath',body:(x,y)=>Bodies.circle(x,y,20,bo({density:.0003,frictionAir:.04,label:'pos:breath'})),draw:dRipple},
  'cleaning space':{kind:'pos',label:'pos:spark',body:(x,y)=>Bodies.polygon(x,y,4,12,bo({density:.0014,restitution:.5,label:'pos:spark'})),draw:dSpark},
  'procrastinating':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,28,40,bo({label:'neg'})),draw:dClock},
  'complaining':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,36,14,bo({label:'neg'})),draw:dLips},
  'oversleeping':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,52,10,bo({label:'neg'})),draw:dBed},
  'doomscrolling':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,28,28,bo({label:'neg'})),draw:dEmoji},
  'negative self-talk':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,60,10,bo({label:'neg'})),draw:dRedBar},
  'sedentary lifestyle':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,48,22,bo({label:'neg'})),draw:dCouch},
  'isolation':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,10,22,bo({label:'neg'})),draw:dStick},
  'passive tv watching':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,36,20,bo({label:'neg'})),draw:dTV},
  'skipping movement':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,20,20,bo({label:'neg'})),draw:dChair},
  'forgetting water':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,14,24,bo({label:'neg'})),draw:dBottle},
  'skipping testing':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,8,28,bo({label:'neg'})),draw:dPencil},
  'siloing knowledge':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,48,32,bo({label:'neg'})),draw:dGate},
  'passive approvals':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,36,16,bo({label:'neg'})),draw:dBinary},
  'tutorial hell':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,32,40,bo({label:'neg'})),draw:dManual},
  'avoiding cleaning':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,20,28,bo({label:'neg'})),draw:dSpray},
  'winging it':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,44,12,bo({label:'neg'})),draw:dWings},
  'passive screen time':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,36,10,bo({label:'neg'})),draw:dCtrl},
  'neglecting partnership':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,36,28,bo({label:'neg'})),draw:dHeart},
  'smoking':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,24,6,bo({label:'neg'})),draw:dCig},
  'repeating routines':{kind:'neg',body:(x,y)=>Bodies.circle(x,y,16,bo({label:'neg'})),draw:dLoop},
  'believing loops':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,20,28,bo({label:'neg'})),draw:dQ},
  'passive ingestion':{kind:'neg',body:(x,y)=>Bodies.rectangle(x,y,28,24,bo({label:'neg'})),draw:dBag}
};

const state={
  phase:PH.INTRO,t:0,housing:[],falling:[],choice:[],drag:null,shapes:[],fx:[],neurons:[],
  flow:0,hitWater:0,missWater:0,streak:0,procrastinationActive:false,
  targetCode:['P','N','P'],playerCode:[],lvl5Timer:0
};

// ---------- Interactive Background Nodes Mapping Engine ----------
function generateBackgroundNeurons(){
  state.neurons=[];
  for(let i=0;i<40;i++){
    state.neurons.push({
      x:Math.random()*W,y:Math.random()*L.WH,vx:0,vy:0,radius:Math.random()*2+1,
      alpha:Math.random()*0.25+0.1,pulseSpeed:0.02+Math.random()*0.02,pulsePhase:Math.random()*Math.PI,
      cleanseGlow:false
    });
  }
}

function triggerLocalSynapseSparks(tx,ty,isCleanse){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,d=Math.random()*30+5;
    state.neurons.push({
      x:tx,y:ty,vx:Math.cos(a)*(isCleanse?4:2),vy:Math.sin(a)*(isCleanse?4:2),
      radius:isCleanse?3:1.5,alpha:1.0,pulseSpeed:0.04,pulsePhase:0,cleanseGlow:isCleanse
    });
  }
}

function drawBackgroundNeuralNetwork(){
  cx.save();cx.translate(0,-cam.y);
  state.neurons.forEach((n,idx)=>{
    n.pulsePhase+=n.pulseSpeed;
    let a=n.alpha+(Math.sin(n.pulsePhase)*0.08);
    if(n.cleanseGlow){cx.fillStyle=COL.water;a=Math.max(0,n.alpha-0.015);n.alpha=a;}
    else if(state.procrastinationActive){cx.fillStyle='#FF5252';}
    else{cx.fillStyle=`rgba(255,255,255,${a})`;}
    n.x+=n.vx;n.y+=n.vy;n.vx*=0.94;n.vy*=0.94;
    cx.beginPath();cx.arc(n.x,n.y,n.radius,0,Math.PI*2);cx.fill();
    
    if(idx%2===0){
      for(let j=idx+1;j<state.neurons.length;j++){
        const o=state.neurons[j],dist=Math.hypot(n.x-o.x,n.y-o.y),maxD=state.procrastinationActive?45:75;
        if(dist<maxD){
          cx.beginPath();cx.moveTo(n.x,n.y);cx.lineTo(o.x,o.y);
          cx.strokeStyle=state.procrastinationActive?`rgba(255,82,82,${(1-dist/maxD)*0.35})`:(n.cleanseGlow?`rgba(79,195,247,${(1-dist/maxD)*0.6})`:`rgba(255,255,255,${(1-dist/maxD)*0.1})`);
          cx.lineWidth=n.cleanseGlow?1.2:0.6;cx.stroke();
        }
      }
    }
  });
  cx.restore();
}

// ---------- Visual Studio Gallery Wall Initializer ----------
function generateGalleryWallHUD(){
  const grid=document.getElementById('galleryWallGrid');
  grid.innerHTML='';
  LEVELS.forEach((lvl,idx)=>{
    const frame=document.createElement('div');
    const isLocked=idx>unlockedLevelIndex;
    if(isLocked){
      frame.className='gallery-frame locked-frame';
      frame.innerHTML=`<div><div class="frame-title">${lvl.name}</div><div class="frame-desc">${lvl.desc}</div></div><div class="frame-status">// MATRIX SECURED</div>`;
    }else{
      frame.className='gallery-frame';
      // Expanded 3 slot modifier confirmation visual badge display
      const slotBonus=idx>0?`<span style="color:#7FE57F; font-size:7px; float:right;">[3-SLOT MULTIPLEX]</span>`:'';
      frame.innerHTML=`<div><div class="frame-title">${lvl.name} ${slotBonus}</div><div class="frame-desc">${lvl.desc}</div></div><div class="frame-status">// ACCESS READY</div>`;
      frame.addEventListener('click',()=>{
        currentLevel=lvl;
        document.getElementById('levelMenuScreen').classList.add('gone');
        bootActiveFrontierArea();
      });
    }
    grid.appendChild(frame);
  });
}

function generateNewCodeTarget(){
  const options=['P','N'];
  state.targetCode=Array.from({length:3},()=>options[Math.floor(Math.random()*options.length)]);
  state.playerCode=[];
  updateDecoderCodeUI();
}

function updateDecoderCodeUI(){
  state.targetCode.forEach((char,idx)=>{
    const el=document.getElementById(`slot${idx}`);
    el.textContent=char;
    if(state.playerCode[idx]===char){
      el.style.borderColor=char==='P'?'#4FC3F7':'#FF5252';
      el.style.color=char==='P'?'#4FC3F7':'#FF5252';
    }else{
      el.style.borderColor='rgba(255,255,255,0.2)';el.style.color='rgba(255,255,255,0.3)';
    }
  });
}

function startRound(){
  populateHousing();
  const levelIdx=LEVELS.indexOf(currentLevel);
  const useThreeSlots=levelIdx>0; // Levels 2, 3, 4, 5 unlock 3 structural capacity slots
  const pool=[...currentLevel.words,...POS];
  
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  const startX=W*0.5,spd=state.procrastinationActive?1.4:1.0;
  
  if(useThreeSlots){
    state.falling=[
      {word:pool[0],kind:POS.includes(pool[0])?'pos':'neg',x:startX-W*0.16,y:L.HEXIT,vy:0,vx:-0.35*spd,target:W*0.32},
      {word:pool[1],kind:POS.includes(pool[1])?'pos':'neg',x:startX,y:L.HEXIT,vy:0,vx:0,target:W*0.50},
      {word:pool[2],kind:POS.includes(pool[2])?'pos':'neg',x:startX+W*0.16,y:L.HEXIT,vy:0,vx:0.35*spd,target:W*0.68}
    ];
  }else{
    state.falling=[
      {word:pool[0],kind:POS.includes(pool[0])?'pos':'neg',x:startX-W*0.10,y:L.HEXIT,vy:0,vx:-0.3*spd,target:W*0.40},
      {word:pool[1],kind:POS.includes(pool[1])?'pos':'neg',x:startX+W*0.10,y:L.HEXIT,vy:0,vx:0.3*spd,target:W*0.60}
    ];
  }
  state.choice=[];state.drag=null;state.phase=PH.SHOW;state.t=0;updHUD();
}

function populateHousing(){
  const all=[...currentLevel.words,...POS];
  state.housing=all.map(word=>({
    word,kind:POS.includes(word)?'pos':'neg',
    bx:(Math.random()-0.5)*L.HW*0.8,by:(Math.random()-0.5)*L.HH*0.6,
    phase:Math.random()*Math.PI*2,speed:0.4+Math.random()*0.4
  }));
}

function updHUD(){
  document.getElementById('cat').textContent=currentLevel.name;
  document.getElementById('ph').textContent={show:'evaluating',eject:'releasing',fall:'transiting',choice:'isolate core',drag:'syncing'}[state.phase]||'·';
  const flowPct=Math.min(100,Math.round(state.flow*100));
  document.getElementById('pct').textContent=flowPct+'%';
  document.getElementById('fill').style.width=flowPct+'%';
  document.getElementById('panicBtn').style.display=(state.phase!==PH.INTRO&&state.phase!==PH.LVL_SELECT&&state.phase!==PH.FULL)?'block':'none';
}

function triggerStreakPopup(text){
  const el=document.getElementById('streakContainer');el.textContent=text;el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),750);
}

// ---------- Phase Logic Ticker Module ----------
function tickPhase(dt){
  state.t+=dt;
  
  // LEVEL 05 AUTO PROCRASTINATION COUNTDOWN TRACKER
  if(currentLevel.id==='senior' && state.phase!==PH.FULL){
    state.lvl5Timer+=dt;
    if(state.lvl5Timer>=35000){ // 35-second automatic load decay triggers auto-procrastinate
      state.lvl5Timer=0;
      executePanicProcrastinateAction();
    }
  }

  if(state.phase===PH.SHOW && state.t>900){state.phase=PH.EJECT;state.t=0;}
  else if(state.phase===PH.EJECT && state.t>350){state.phase=PH.FALL;state.t=0;}
  else if(state.phase===PH.FALL){
    const stepM=state.procrastinationActive?1.3:1.0;
    state.falling.forEach(f=>{f.vy+=.32*(dt/16.67)*stepM;f.y+=f.vy*(dt/16.67);f.x+=(f.target-f.x)*0.05;});
    if(state.falling.every(f=>f.y>=L.BY)){
      state.falling.forEach(f=>{f.y=L.BY;});state.phase=PH.CHOICE;state.t=0;
      state.choice=state.falling.map(f=>({word:f.word,kind:f.kind,x:f.x,y:f.y,vanish:0}));
      state.falling=[];updHUD();
    }
  }else if(state.phase===PH.SETTLE){
    const allSettled=state.shapes.length===0||state.shapes.every(s=>s.dead||Math.abs(s.body.velocity.y)<0.5);
    if(allSettled && state.t>950){
      if(state.shapes.some(s=>!s.dead && s.body.position.y<L.BT-5)){triggerFullBurnoutFailure();}
      else{startRound();}
    }
  }
}

function spawnShape(word,x,y,vx,vy){
  const def=S[word];if(!def)return;
  const body=def.body(x,y);
  Body.setVelocity(body,{x:(vx||0)*0.5,y:(vy||0)*0.5+1});
  Composite.add(eng.world,body);
  state.shapes.push({body,def,word,hits:0,dead:false,kind:def.kind});
  
  triggerLocalSynapseSparks(x,y,false);

  // LEVEL 04 INTEGRATION MODULE: ADAPTIVE SYNAPSE MATRIX VALIDATION
  if(currentLevel.id==='quantum' || currentLevel.id==='senior'){
    const inputChar=def.kind==='pos'?'P':'N';
    const expectedChar=state.targetCode[state.playerCode.length];
    if(inputChar===expectedChar){
      state.playerCode.push(inputChar);updateDecoderCodeUI();
      if(state.playerCode.length===3){
        triggerStreakPopup("SYNAPSE LINKED // RELEASING BOTTOM DEBT");
        state.shapes.forEach(s=>{if(s.body.position.y>L.BB-45)executeShatterCleansing(s);});
        state.neurons.forEach(n=>{if(Math.random()>0.5)n.cleanseGlow=true;});
        setTimeout(generateNewCodeTarget,500);
      }
    }else{
      state.playerCode=[];if(inputChar===state.targetCode[0])state.playerCode.push(inputChar);
      updateDecoderCodeUI();
    }
  }
}

// ---------- Collisions Configuration Modules ----------
Events.on(eng,'collisionStart',(e)=>{e.pairs.forEach(p=>{handlePair(p.bodyA,p.bodyB);handlePair(p.bodyB,p.bodyA);});});
function handlePair(a,b){
  if(!a.label||!a.label.startsWith('pos:'))return;
  const ps=state.shapes.find(s=>s.body===a);if(!ps||ps.dead)return;
  if(b.label==='neg'){
    const ng=state.shapes.find(s=>s.body===b);if(!ng||ng.dead)return;
    if(a.label==='pos:water'||a.label==='pos:spark'){
      ng.hits+=(a.label==='pos:spark'?2:1);state.streak++;
      if(state.streak>=2)triggerStreakPopup(`STREAK X${state.streak}`);
      state.fx.push({type:'wave',x:a.position.x,y:a.position.y,r:0,life:400,c:COL.water});
      state.hitWater=Math.min(1,state.hitWater+0.04*state.streak);
      state.flow=Math.min(1,state.hitWater+state.missWater*0.3);updHUD();
      if(ng.hits>=3)executeShatterCleansing(ng);
      Composite.remove(eng.world,a);ps.dead=true;
    }
  }else if(b.label==='floor'){
    if(a.label==='pos:water'||a.label==='pos:spark'){
      state.streak=0;state.missWater=Math.min(1,state.missWater+0.05);
      state.flow=Math.min(1,state.hitWater+state.missWater*0.3);updHUD();
      Composite.remove(eng.world,a);ps.dead=true;
    }
  }
  if(state.flow>=1.0)triggerLevelClearedSuccess();
}

function executeShatterCleansing(s){
  if(s.dead)return;s.dead=true;
  const tx=s.body.position.x,ty=s.body.position.y;
  for(let i=0;i<15;i++){state.fx.push({type:'burst',x:tx,y:ty,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,life:600,c:'#4FC3F7'});}
  state.fx.push({type:'wave',x:tx,y:ty,r:4,life:500,c:'#4FC3F7'});
  Composite.remove(eng.world,s.body);
  triggerLocalSynapseSparks(tx,ty,true);
  state.neurons.forEach(n=>{if(Math.hypot(n.x-tx,n.y-ty)<140){n.cleanseGlow=true;n.vx+=(tx-n.x)*0.2;n.vy+=(ty-n.y)*0.2;}});
}

function tickForces(dt){
  state.shapes.forEach(s=>{
    if(s.dead)return;
    if(s.kind==='neg'){const sw=Math.sin(performance.now()*.001+s.body.id)*0.0001*s.body.mass;Body.applyForce(s.body,s.body.position,{x:sw,y:0});}
    if(s.def===S['taking deep breath']){
      state.shapes.forEach(o=>{
        if(o===s||o.dead)return;const dx=o.body.position.x-s.body.position.x,dy=o.body.position.y-s.body.position.y,d=Math.hypot(dx,dy);
        if(d<85&&d>0){const f=.0004*(1-d/85)*o.body.mass;Body.applyForce(o.body,o.body.position,{x:dx/d*f,y:dy/d*f*.3});}
      });
    }
  });
}

function tickFx(dt){
  for(let i=state.fx.length-1;i>=0;i--){
    const e=state.fx[i];e.life-=dt;if(e.life<=0){state.fx.splice(i,1);continue;}
    if(e.type==='burst'){e.x+=e.vx;e.y+=e.vy;e.vy+=.08;}else if(e.type==='wave'){e.r+=2.5;}
  }
  for(let i=state.shapes.length-1;i>=0;i--){if(state.shapes[i].dead)state.shapes.splice(i,1);}
}

// ---------- Engine Rendering Core Pipeline ----------
function renderMainFramePipeline(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  drawBackgroundNeuralNetwork();
  cx.save();cx.translate(0,-cam.y);
  
  if(state.phase!==PH.INTRO && state.phase!==PH.LVL_SELECT){
    // Draw Environment Frame Layout
    cx.strokeStyle=state.procrastinationActive?COL.panicRed:COL.line;cx.lineWidth=1.4;
    cx.strokeRect(L.BCX-L.HW/2,L.HC-L.HH/2,L.HW,L.HH);
    state.housing.forEach(hw=>{
      const t=performance.now()*.001,x=W/2+hw.bx+Math.sin(t*hw.speed+hw.phase)*5,y=L.HC+hw.by+Math.cos(t*hw.speed*0.8+hw.phase)*3;
      cx.fillStyle=hw.kind==='pos'?COL.water:COL.line;cx.font='500 8px monospace';cx.textAlign='center';cx.fillText(hw.word.toUpperCase(),x,y);
    });

    // Draw Lightbulb Bulb Frame
    cx.strokeStyle=state.procrastinationActive?COL.panicRed:COL.line;cx.lineWidth=1.4;
    cx.beginPath();cx.arc(W/2,L.BY,L.BR,0,Math.PI*2);cx.stroke();
    if(state.phase===PH.CHOICE||state.phase===PH.DRAG){
      const g=cx.createRadialGradient(W/2,L.BY,4,W/2,L.BY,L.BR);
      g.addColorStop(0,state.procrastinationActive?'rgba(255,82,82,0.2)':'rgba(255,235,150,.15)');g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g;cx.fill();
    }

    // Draw Container Cortex Area
    cx.strokeStyle=state.procrastinationActive?COL.panicRed:COL.line;cx.lineWidth=1.5;
    cx.strokeRect(L.BCX-L.BHW,L.BT,L.BHW*2,L.BB-L.BT);
    if(state.flow>0){
      const wy=L.BB-state.flow*(L.BB-L.BT-10);cx.save();cx.beginPath();cx.rect(L.BCX-L.BHW+1,wy,L.BHW*2-2,L.BB-wy);cx.clip();
      cx.fillStyle=state.procrastinationActive?'rgba(255,82,82,0.15)':'rgba(79,195,247,.15)';cx.fillRect(L.BCX-L.BHW,wy,L.BHW*2,L.BB-wy);
      cx.strokeStyle=state.procrastinationActive?COL.panicRed:COL.water;cx.beginPath();const tt=performance.now()*.002;
      for(let xx=L.BCX-L.BHW;xx<=L.BCX+L.BHW;xx+=4){cx.lineTo(xx,wy+Math.sin((xx+tt*50)*.05)*2.5);}cx.stroke();cx.restore();
    }

    cx.font='500 11px monospace';cx.textAlign='center';
    state.falling.forEach(f=>{cx.fillStyle=f.kind==='pos'?COL.water:COL.line;cx.fillText(f.word.toUpperCase(),f.x,f.y);});
    if(state.phase===PH.CHOICE){
      state.choice.forEach(c=>{cx.strokeStyle=c.kind==='pos'?COL.water:COL.line;cx.fillStyle='#000';cx.strokeRect(c.x-45,L.BY-10,90,20);cx.fillStyle=c.kind==='pos'?COL.water:COL.line;cx.fillText(c.word.toUpperCase(),c.x,L.BY+4);});
    }
    if(state.phase===PH.DRAG && state.drag){cx.fillStyle=state.drag.kind==='pos'?COL.water:COL.line;cx.fillText(state.drag.word.toUpperCase(),state.drag.x,state.drag.y);}
    state.shapes.forEach(s=>{if(!s.dead)s.def.draw(s.body);});
    state.fx.forEach(e=>{cx.save();cx.fillStyle=e.c;cx.strokeStyle=e.c;cx.globalAlpha=Math.max(0,e.life/600);if(e.type==='burst'){cx.beginPath();cx.arc(e.x,e.y,1.5,0,Math.PI*2);cx.fill();}else if(e.type==='wave'){cx.beginPath();cx.arc(e.x,e.y,e.r,0,Math.PI*2);cx.stroke();}cx.restore();});
  }
  cx.restore();
}

function loop(now){const dt=Math.min(35,now-lastT);lastT=now;if(!scrollDrag&&!state.drag){cam.y+=cam.vy;cam.vy*=0.9;clampCam();}if(state.phase!==PH.INTRO&&state.phase!==PH.LVL_SELECT&&state.phase!==PH.FULL){Engine.update(eng,dt);tickForces(dt);tickPhase(dt);tickFx(dt);}renderMainFramePipeline();requestAnimationFrame(loop);}
let lastT=performance.now();

// ---------- Emergency Actions Execution Modules ----------
function executePanicProcrastinateAction(){
  state.procrastinationActive=true;
  state.hitWater=Math.max(0,state.hitWater-0.2);state.missWater=Math.max(0,state.missWater-0.15);
  state.flow=Math.min(1,state.hitWater+state.missWater*0.3);updHUD();
  state.neurons.forEach(n=>{n.vx+=(Math.random()-0.5)*12;n.vy+=(Math.random()-0.5)*12;});
  state.shapes.forEach(s=>{if(s.kind==='neg'&&!s.dead){Body.setMass(s.body,s.body.mass*2.2);}});
  triggerStreakPopup("DEBT COMPOUNDED. STABILITY CONSTRICTED.");
}
document.getElementById('panicBtn').addEventListener('click',executePanicProcrastinateAction);

// ---------- Input Controllers ----------
let scrollDrag=null;
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches&&e.touches[0]||e.changedTouches&&e.changedTouches[0]||e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function onDown(e){
  if(state.phase===PH.INTRO||state.phase===PH.LVL_SELECT||state.phase===PH.FULL)return;const p=pos(e);
  if(state.phase===PH.CHOICE){
    let picked=null;state.choice.forEach(c=>{if(Math.abs(p.x-c.x)<50&&Math.abs((p.y+cam.y)-L.BY)<25)picked=c;});
    if(picked){state.drag={word:picked.word,kind:picked.kind,x:picked.x,y:L.BY,px:p.x,py:p.y};state.choice=[];state.phase=PH.DRAG;updHUD();return;}
  }
  scrollDrag={x:p.x,y:p.y,lastY:p.y,lastT:performance.now()};cam.vy=0;
}
function onMove(e){if(state.drag){const p=pos(e);state.drag.x=p.x;state.drag.y=p.y+cam.y;}else if(scrollDrag){const p=pos(e);cam.y+=(scrollDrag.y-p.y);clampCam();const now=performance.now();if(now-scrollDrag.lastT>0)cam.vy=(scrollDrag.lastY-p.y)/(now-scrollDrag.lastT)*12;scrollDrag.lastY=p.y;scrollDrag.lastT=now;scrollDrag.x=p.x;scrollDrag.y=p.y;}}
function onUp(){if(state.drag){spawnShape(state.drag.word,state.drag.x,state.drag.y,0,1);state.drag=null;state.phase=PH.SETTLE;state.t=0;updHUD();}scrollDrag=null;}

function bootActiveFrontierArea(){
  document.getElementById('hudTop').style.display='flex';document.getElementById('hudBot').style.display='flex';
  document.getElementById('scrollHint').style.display='block';document.getElementById('escBtn').style.display='block';
  
  // Conditionally make the 3-letter sequence display tracking row visible
  const wrap=document.getElementById('sequenceWrapper');
  if(currentLevel.id==='quantum' || currentLevel.id==='senior'){wrap.style.opacity='1';generateNewCodeTarget();}
  else{wrap.style.opacity='0';}
  
  state.lvl5Timer=0;generateBackgroundNeurons();startRound();
}

function triggerLevelClearedSuccess(){
  state.phase=PH.FULL;const curIdx=LEVELS.indexOf(currentLevel);
  if(curIdx===unlockedLevelIndex && unlockedLevelIndex<LEVELS.length-1){
    unlockedLevelIndex++;localStorage.setItem('mre_unlocked_idx',unlockedLevelIndex);
  }
  document.getElementById('saying').textContent="COGNITIVE SYNC INDEX MET";
  document.getElementById('failSubtitle').textContent="Memory frame processed into studio gallery. Click to continue.";
  document.getElementById('over').classList.add('show');
}
function triggerFullBurnoutFailure(){
  state.phase=PH.FULL;document.getElementById('saying').textContent="MATRIX DISRUPTED // UNMANAGEABLE OVERLOAD";
  document.getElementById('failSubtitle').textContent="Click to return to studio command dashboard.";
  document.getElementById('over').classList.add('show');
}

document.getElementById('over').addEventListener('click',()=>{
  document.getElementById('over').classList.remove('show');
  state.shapes.forEach(s=>Composite.remove(eng.world,s.body));state.shapes=[];state.fx=[];state.flow=0;state.hitWater=0;state.missWater=0;state.streak=0;state.procrastinationActive=false;cam.y=0;cam.vy=0;
  state.phase=PH.LVL_SELECT;generateGalleryWallHUD();document.getElementById('levelMenuScreen').classList.remove('gone');updHUD();
});
document.getElementById('initSyncBtn').addEventListener('click',()=>{document.getElementById('mainTitleScreen').classList.add('gone');state.phase=PH.LVL_SELECT;generateGalleryWallHUD();document.getElementById('levelMenuScreen').classList.remove('gone');updHUD();});
document.getElementById('escBtn').addEventListener('click',()=>{document.getElementById('pauseScreen').classList.remove('gone');});
document.getElementById('resumeBtn').addEventListener('click',()=>{document.getElementById('pauseScreen').classList.add('gone');});
document.getElementById('restartBtn').addEventListener('click',()=>{document.getElementById('pauseScreen').classList.add('gone');state.shapes.forEach(s=>Composite.remove(eng.world,s.body));state.shapes=[];state.fx=[];state.flow=0;state.hitWater=0;state.missWater=0;state.streak=0;state.procrastinationActive=false;cam.y=0;cam.vy=0;startRound();});
document.getElementById('abortBtn').addEventListener('click',()=>{document.getElementById('pauseScreen').classList.add('gone');document.getElementById('hudTop').style.display='none';document.getElementById('hudBot').style.display='none';document.getElementById('scrollHint').style.display='none';document.getElementById('escBtn').style.display='none';state.shapes.forEach(s=>Composite.remove(eng.world,s.body));state.shapes=[];state.fx=[];state.flow=0;state.hitWater=0;state.missWater=0;state.streak=0;state.procrastinationActive=false;cam.y=0;cam.vy=0;document.getElementById('mainTitleScreen').classList.remove('gone');state.phase=PH.INTRO;updHUD();});

cv.addEventListener('mousedown',onDown);cv.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown);cv.addEventListener('touchmove',onMove);window.addEventListener('touchend',onUp);
addEventListener('resize',resize);resize();generateBackgroundNeurons();requestAnimationFrame(loop);
</script>
